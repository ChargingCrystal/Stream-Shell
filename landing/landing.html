<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Stream Shell</title>

    <link
        rel="stylesheet"
        href="landing.css"
    >

</head>


<body data-provider="netflix">

    <main class="landing">

        <div
            id="panorama-background"
            class="panorama-background"
            aria-hidden="true"
        ></div>


        <div
            class="landing-shade"
            aria-hidden="true"
        ></div>


        <section
            id="subscription-panel"
            class="subscription-panel"
            aria-label="Subscription status"
        >

            <header class="subscription-panel-header">

                <div>
                    <div class="subscription-panel-title">Subscriptions</div>
                    <div id="subscription-sync-meta" class="subscription-sync-meta">Never synced</div>
                </div>

                <button
                    type="button"
                    id="subscription-sync"
                    class="subscription-sync"
                    title="Sync subscriptions"
                    aria-label="Sync subscriptions"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 7V3.5L17.2 6.3A8 8 0 1 0 19.3 14"></path>
                        <path d="M20 3.5H16.5"></path>
                    </svg>
                </button>

            </header>

            <div class="subscription-grid">

                <div class="subscription-item" data-subscription-provider="youtube">
                    <img src="../assets/providers/icons/youtube.svg" alt="" aria-hidden="true">
                    <span class="subscription-name">YouTube</span>
                    <span class="subscription-status">UNKNOWN</span>
                    <span class="subscription-renewal">—</span>
                </div>

                <div class="subscription-item" data-subscription-provider="netflix">
                    <img src="../assets/providers/icons/netflix.svg" alt="" aria-hidden="true">
                    <span class="subscription-name">Netflix</span>
                    <span class="subscription-status">UNKNOWN</span>
                    <span class="subscription-renewal">—</span>
                </div>

                <div class="subscription-item" data-subscription-provider="prime">
                    <img src="../assets/providers/icons/prime.svg" alt="" aria-hidden="true">
                    <span class="subscription-name">Prime</span>
                    <span class="subscription-status">UNKNOWN</span>
                    <span class="subscription-renewal">—</span>
                </div>

                <div class="subscription-item" data-subscription-provider="disney">
                    <img src="../assets/providers/icons/disney.svg" alt="" aria-hidden="true">
                    <span class="subscription-name">Disney+</span>
                    <span class="subscription-status">UNKNOWN</span>
                    <span class="subscription-renewal">—</span>
                </div>

                <div class="subscription-item" data-subscription-provider="crunchyroll">
                    <img src="../assets/providers/icons/crunchyroll.svg" alt="" aria-hidden="true">
                    <span class="subscription-name">Crunchyroll</span>
                    <span class="subscription-status">UNKNOWN</span>
                    <span class="subscription-renewal">—</span>
                </div>

                <div class="subscription-item" data-subscription-provider="discord">
                    <img src="../assets/providers/icons/discord.svg" alt="" aria-hidden="true">
                    <span class="subscription-name">Discord</span>
                    <span class="subscription-status">UNKNOWN</span>
                    <span class="subscription-renewal">—</span>
                </div>

            </div>

        </section>


        <section class="landing-brand">

            <img
                class="landing-wordmark"
                src="../assets/brand/stream-shell-wordmark.png"
                alt="Stream Shell"
            >

        </section>


        <section
            id="media-hub"
            class="media-hub"
        >

            <div class="media-hub-controls">

                <button
                    type="button"
                    id="watchlist-toggle"
                    class="hub-control watchlist-control"
                    aria-expanded="false"
                >

                    <svg
                        class="hub-control-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M6 3.75C6 2.78 6.78 2 7.75 2H16.25C17.22 2 18 2.78 18 3.75V21L12 17.25L6 21Z"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linejoin="round"
                        ></path>
                    </svg>

                    <span>
                        Watchlist
                    </span>

                    <span
                        id="watchlist-count"
                        class="watchlist-count"
                    >
                        0
                    </span>

                </button>


                <div
                    id="search-control"
                    class="hub-control search-control"
                >

                    <svg
                        class="hub-control-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <circle
                            cx="10.8"
                            cy="10.8"
                            r="6.5"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                        ></circle>

                        <path
                            d="M15.7 15.7L21 21"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        ></path>
                    </svg>

                    <input
                        id="media-search-input"
                        class="media-search-input"
                        type="search"
                        autocomplete="off"
                        spellcheck="false"
                        placeholder="Search movies and TV shows..."
                        aria-label="Search movies and TV shows"
                    >

                    <button
                        type="button"
                        id="media-search-clear"
                        class="media-search-clear"
                        title="Clear search"
                        aria-label="Clear search"
                        hidden
                    >
                        ×
                    </button>

                </div>

            </div>


            <section
                id="media-panel"
                class="media-panel"
                hidden
            >

                <header class="media-panel-header">

                    <div class="media-panel-heading">

                        <div
                            id="library-header-controls"
                            class="library-header-controls"
                        >

                            <button
                                type="button"
                                id="watchlist-tab"
                                class="library-tab active"
                            >
                                Official
                            </button>


                            <button
                                type="button"
                                id="continue-tab"
                                class="library-tab"
                            >
                                Continue
                            </button>


                            <button
                                type="button"
                                id="recent-tab"
                                class="library-tab"
                            >
                                Recent
                            </button>


                            <button
                                type="button"
                                id="direct-tab"
                                class="library-tab"
                            >
                                Direct
                            </button>


                            <button
                                type="button"
                                id="watchlist-import"
                                class="library-icon-button"
                                title="Import Watchlist"
                                aria-label="Import Watchlist"
                            >

                                <svg
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >
                                    <path
                                        d="M12 4V15M8.5 11.5L12 15L15.5 11.5"
                                    ></path>

                                    <path
                                        d="M5 13.5V18.5C5 19.3 5.7 20 6.5 20H17.5C18.3 20 19 19.3 19 18.5V13.5"
                                    ></path>
                                </svg>

                            </button>


                            <button
                                type="button"
                                id="watchlist-export"
                                class="library-icon-button"
                                title="Export Watchlist"
                                aria-label="Export Watchlist"
                            >

                                <svg
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >
                                    <path
                                        d="M12 15V4M8.5 7.5L12 4L15.5 7.5"
                                    ></path>

                                    <path
                                        d="M5 13.5V18.5C5 19.3 5.7 20 6.5 20H17.5C18.3 20 19 19.3 19 18.5V13.5"
                                    ></path>
                                </svg>

                            </button>

                        </div>


                        <div
                            id="search-header-title"
                            class="search-header-title"
                            hidden
                        >
                            Search Results
                        </div>


                        <div
                            id="media-panel-subtitle"
                            class="media-panel-subtitle"
                        ></div>

                    </div>


                    <div class="media-panel-header-actions">

                        <label
                            id="watchlist-sort-wrapper"
                            class="watchlist-sort-wrapper"
                            hidden
                        >

                            <span class="watchlist-sort-label">
                                Sort
                            </span>


                            <select
                                id="watchlist-sort"
                                class="watchlist-sort"
                                aria-label="Sort watchlist"
                            >

                                <option value="added-desc">
                                    Added: Newest
                                </option>

                                <option value="added-asc">
                                    Added: Oldest
                                </option>

                                <option value="title-asc">
                                    Title: A–Z
                                </option>

                                <option value="title-desc">
                                    Title: Z–A
                                </option>

                                <option value="release-desc">
                                    Release: Newest
                                </option>

                                <option value="release-asc">
                                    Release: Oldest
                                </option>

                            </select>

                        </label>


                        <button
                            type="button"
                            id="media-panel-close"
                            class="media-panel-close"
                            title="Close"
                            aria-label="Close"
                        >
                            ×
                        </button>

                    </div>

                </header>


                <div
                    id="media-panel-body"
                    class="media-panel-body"
                ></div>


                <footer class="media-panel-footer">

                    <span
                        id="availability-attribution"
                        class="availability-attribution"
                    >
                        Streaming availability: JustWatch via TMDB
                    </span>


                    <button
                        type="button"
                        id="tmdb-token-button"
                        class="tmdb-token-button"
                        title="Change TMDB Read Access Token"
                    >
                        API
                    </button>

                </footer>

            </section>

        </section>


        <button
            type="button"
            id="restore-home-layout"
            class="restore-home-layout"
            title="Restore Landing + Dashboard"
            aria-label="Restore Landing and Dashboard layout"
        >

            <svg
                class="restore-layout-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M4.5 10.5L12 4L19.5 10.5V19H14.5V14H9.5V19H4.5Z"
                ></path>
            </svg>


            <span
                class="restore-layout-divider"
                aria-hidden="true"
            ></span>


            <svg
                class="restore-layout-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <rect
                    x="4.5"
                    y="4.5"
                    width="6"
                    height="6"
                    rx="1.3"
                ></rect>

                <rect
                    x="13.5"
                    y="4.5"
                    width="6"
                    height="6"
                    rx="1.3"
                ></rect>

                <rect
                    x="4.5"
                    y="13.5"
                    width="6"
                    height="6"
                    rx="1.3"
                ></rect>

                <rect
                    x="13.5"
                    y="13.5"
                    width="6"
                    height="6"
                    rx="1.3"
                ></rect>
            </svg>

        </button>



        <button
            type="button"
            id="discord"
            class="landing-discord"
            title="Open Discord desktop"
            aria-label="Open Discord desktop"
        >

            <img
                src="../assets/providers/icons/discord.svg"
                alt=""
                aria-hidden="true"
            >

            <span>
                Discord
            </span>

        </button>


        <div
            id="twitch-utility"
            class="landing-twitch"
            role="group"
            aria-label="Twitch utility"
        >
            <button
                type="button"
                id="twitch-open"
                class="landing-twitch-main"
                title="Open Twitch"
                aria-label="Open Twitch"
            >
                <img
                    class="landing-twitch-mark"
                    src="../assets/providers/icons/twitch.svg"
                    alt=""
                    aria-hidden="true"
                >
                <span>Twitch</span>
            </button>

            <button
                type="button"
                id="twitch-drops"
                class="landing-twitch-drops"
                title="Open Twitch Drops"
                aria-label="Open Twitch Drops"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 10h16v10H4zM3 7h18v4H3zM12 7v13M7.2 7C5.9 7 5 6.2 5 5.2 5 4 6 3.2 7.3 3.2 9.3 3.2 11 5.2 12 7c1-1.8 2.7-3.8 4.7-3.8C18 3.2 19 4 19 5.2 19 6.2 18.1 7 16.8 7H7.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>


        <input
            id="watchlist-import-input"
            type="file"
            accept="application/json,.json"
            hidden
        >

    </main>


    <script src="../media/media-api.js"></script>
    <script src="../media/watchlist.js"></script>
    <script src="../media/direct-links.js"></script>
    <script src="../media/continue-watching.js"></script>
    <script src="../media/history.js"></script>
    <script src="../media/availability.js"></script>
    <script src="landing.js"></script>

</body>

</html>
