name: Stream Shell quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-shell-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: JavaScript, bundles and regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Stream Shell source, bundles and behavior
        run: node tools/check-project.mjs
